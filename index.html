<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>BELGFR – Scores v0.11</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/scoreboard-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app-root">
      <header class="topbar" role="banner">
        <span class="app__version" aria-label="Version 0.11">0.11</span>
        <div class="topbar__tabs">
          <div class="tabs" role="tablist" aria-label="Modes de gestion">
            <button
              id="tab-add"
              class="tabs__button tabs__button--active"
              role="tab"
              type="button"
              data-panel="add"
              aria-selected="true"
              aria-controls="panel-add"
            >
              Classement
            </button>
            <button
              id="tab-remove"
              class="tabs__button"
              role="tab"
              type="button"
              data-panel="remove"
              aria-selected="false"
              aria-controls="panel-remove"
            >
              Historique
            </button>
          </div>
        </div>
        <div class="topbar__actions">
          <button
            id="add-player-toggle"
            class="panel__action-button"
            type="button"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="add-player-dialog"
          >
            <span class="sr-only">Ajouter un nouveau joueur</span>
            <svg
              class="panel__action-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="M12 5a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H6a1 1 0 1 1 0-2h5V6a1 1 0 0 1 1-1Z"
              />
            </svg>
          </button>
          <div
            id="add-player-dialog"
            class="player-form-popover"
            role="dialog"
            aria-modal="false"
            aria-labelledby="add-player-form-title"
            hidden
          >
            <form id="add-player-form" class="player-form player-form--popover" autocomplete="off">
              <div class="player-form__header">
                <h2 id="add-player-form-title" class="player-form__title">Nouveau joueur</h2>
                <button
                  type="button"
                  class="player-form__close"
                  data-close-player-form
                  aria-label="Fermer le formulaire"
                >
                  <svg
                    class="player-form__close-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      fill="currentColor"
                      d="M12 10.586 16.95 5.64a1 1 0 0 1 1.414 1.414L13.414 12l4.95 4.95a1 1 0 0 1-1.414 1.414L12 13.414l-4.95 4.95a1 1 0 0 1-1.414-1.414L10.586 12 5.636 7.05A1 1 0 0 1 7.05 5.636L12 10.586Z"
                    />
                  </svg>
                </button>
              </div>
              <div class="player-form__fields">
                <div class="player-form__field">
                  <label class="player-form__label" for="add-player-name">Nom</label>
                  <input
                    id="add-player-name"
                    class="player-form__input"
                    name="name"
                    type="text"
                    placeholder="Nom du joueur"
                    required
                    autocomplete="off"
                  />
                </div>
                <div class="player-form__field player-form__field--compact">
                  <label class="player-form__label" for="add-player-initial-score">Score initial</label>
                  <input
                    id="add-player-initial-score"
                    class="player-form__input"
                    name="initial_score"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    max="99"
                    step="1"
                    value="0"
                    required
                  />
                </div>
              </div>
              <button id="add-player-submit" class="player-form__submit" type="submit">
                Ajouter le joueur
              </button>
            </form>
          </div>
        </div>
      </header>
      <main class="layout" aria-live="polite">
        <section
          id="panel-add"
          class="panel panel--active"
          role="tabpanel"
          aria-labelledby="tab-add"
          data-panel="add"
        >
          <div id="add-players" class="panel__players" role="list"></div>
        </section>
        <section
          id="panel-remove"
          class="panel panel--remove"
          role="tabpanel"
          aria-labelledby="tab-remove"
          data-panel="remove"
          hidden
        >
          <div class="remove-layout">
            <section class="remove-layout__history" aria-labelledby="remove-history-title">
              <h2 id="remove-history-title" class="panel__subtitle">Historique des points</h2>
              <form id="history-filters" class="history-filters" autocomplete="off">
                <div class="history-filters__field">
                  <label class="history-filters__label" for="history-filter-player">Joueur</label>
                  <select
                    id="history-filter-player"
                    class="history-filters__control"
                    name="player"
                    aria-label="Filtrer l'historique par joueur"
                  >
                    <option value="all">Tous les joueurs</option>
                  </select>
                </div>
                <div class="history-filters__field">
                  <label class="history-filters__label" for="history-filter-order">Ordre</label>
                  <select
                    id="history-filter-order"
                    class="history-filters__control"
                    name="order"
                    aria-label="Choisir l'ordre d'affichage de l'historique"
                  >
                    <option value="desc">Plus récent en premier</option>
                    <option value="asc">Du plus ancien au plus récent</option>
                  </select>
                </div>
                <div class="history-filters__actions">
                  <button id="history-filter-reset" class="history-filters__reset" type="button">
                    Réinitialiser
                  </button>
                </div>
              </form>
              <div class="history" aria-label="Historique">
                <ol id="history" class="history__list" aria-live="polite"></ol>
                <p id="history-empty" class="history__empty" hidden>Aucune action</p>
              </div>
            </section>
            <section class="remove-layout__players" aria-labelledby="remove-players-title">
              <h2 id="remove-players-title" class="panel__subtitle panel__subtitle--muted">
                Retirer un joueur
              </h2>
              <p class="remove-players__hint">À utiliser seulement en cas de départ définitif.</p>
              <ul id="remove-players" class="remove-players" role="list"></ul>
              <p id="remove-players-empty" class="remove-players__empty" hidden>
                Aucun joueur à retirer
              </p>
            </section>
          </div>
        </section>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </main>
    </div>

    <noscript>Active JavaScript pour suivre les scores.</noscript>

    <script type="module" src="./app.js"></script>
  </body>
</html>
