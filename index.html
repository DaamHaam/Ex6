<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>BELGFR – Scores v0.04</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/scoreboard-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app-root">
      <span class="app__version" aria-label="Version 0.04">0.04</span>
      <main class="layout" aria-live="polite">
        <section class="scores" aria-label="Scores">
          <div id="players" class="scores__list" role="list"></div>
        </section>
        <section class="history" aria-label="Historique">
          <ol id="history" class="history__list" aria-live="polite"></ol>
          <p id="history-empty" class="history__empty" hidden>Aucune action</p>
        </section>
      </main>
      <footer class="app__footer">
        <button
          id="undo-button"
          class="button button--undo"
          type="button"
          aria-label="Annuler la dernière action"
        >
          Annuler
        </button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </footer>
    </div>

    <noscript>Active JavaScript pour suivre les scores.</noscript>

    <script type="module" src="./app.js"></script>
  </body>
</html>
